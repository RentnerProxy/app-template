version: 2
updates:
    - package-ecosystem: 'bun'
      directory: '/'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          bun-minor-and-patch:
              applies-to: 'version-updates'
              patterns: ['*']
              update-types: ['minor', 'patch']
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 1
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          github-actions-minor-and-patch:
              applies-to: 'version-updates'
              patterns: ['*']
              update-types: ['minor', 'patch']
