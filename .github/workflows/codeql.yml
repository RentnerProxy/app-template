name: CodeQL

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: '23 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: CodeQL (${{ matrix.display-name }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      display-name: JavaScript / TypeScript
                    - language: actions
                      display-name: GitHub Actions
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            - name: Analyze
              uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
              with:
                  category: /language:${{ matrix.language }}
