name: autofix.ci

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: autofix-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    autofix:
        name: Autofix
        if: github.repository_owner == 'RentnerProxy'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pinned Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Format source and configuration outside protected GitHub automation
              run: bun --no-env-file fmt src scripts app.config.json api package.json tsconfig.json README.md

            - name: Apply formatting fixes
              uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
              with:
                  commit-message: 'style: apply automatic formatting'
                  fail-fast: false
