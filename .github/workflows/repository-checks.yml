name: Repository Checks

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: repository-checks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    workflow-lint:
        name: Workflow Lint
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Check out pinned Platform tooling
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: RentnerProxy/Platform
                  ref: 1b61342853277f48a73069e246c553539e656b7b
                  path: platform-tooling
                  sparse-checkout: .github/scripts/ci/install-actionlint.sh
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: bash platform-tooling/.github/scripts/ci/install-actionlint.sh

            - name: Lint workflows and automation shell scripts
              run: |
                  "$RUNNER_TEMP/actionlint" -color
                  find .github/scripts -type f -name '*.sh' -print0 | xargs -0 -r -- shellcheck

    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check out pinned Platform tooling
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: RentnerProxy/Platform
                  ref: 1b61342853277f48a73069e246c553539e656b7b
                  path: platform-tooling
                  sparse-checkout: .github/scripts/security/install-gitleaks.sh
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Install Gitleaks
              env:
                  GITLEAKS_VERSION: 8.30.1
                  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              run: bash platform-tooling/.github/scripts/security/install-gitleaks.sh

            - name: Scan commits with default rules and redacted output
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  PUSH_AFTER_SHA: ${{ github.event.after }}
              shell: bash
              run: |
                  case "$EVENT_NAME" in
                      pull_request)
                          scan_log_opts="-m ${PR_BASE_SHA}..${PR_HEAD_SHA}"
                          ;;
                      push)
                          if git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
                              scan_log_opts="-m ${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
                          else
                              scan_log_opts="-m $PUSH_AFTER_SHA"
                          fi
                          ;;
                      workflow_dispatch)
                          scan_log_opts='-m --all'
                          ;;
                      *) exit 1 ;;
                  esac
                  config_path="$RUNNER_TEMP/gitleaks.toml"
                  printf '%s\n' '[extend]' 'useDefault = true' > "$config_path"
                  "$RUNNER_TEMP/gitleaks" git --config="$config_path" \
                      --gitleaks-ignore-path=/dev/null --redact=100 --no-banner --no-color \
                      --log-opts="$scan_log_opts" .

    dependency-review:
        name: Dependency Review
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Review dependency changes
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  fail-on-severity: moderate
                  vulnerability-check: true
                  license-check: false

    bun-audit:
        name: Bun Audit
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out the lockfile
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pinned Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: package.json

            - name: Check the Bun lockfile for advisories
              run: bun --no-env-file audit --audit-level moderate
